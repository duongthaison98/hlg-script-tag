<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three Forms Example</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4 text-center">Script tag form</h1>
      <div class="row">
        <div class="col-md-4">
          <form id="form1" class="mb-4">
            <h3>Form 1</h3>
            <div class="mb-3">
              <label for="email1" class="form-label">Email</label>
              <div class="d-flex gap-2">
                <input
                  type="email"
                  class="form-control"
                  id="email1"
                  name="email1"
                  placeholder="Enter email"
                />
              </div>
            </div>
            <div class="mb-3">
              <label for="phone1" class="form-label">Phone Number</label>
              <div class="d-flex gap-2">
                <input
                  type="tel"
                  class="form-control"
                  id="phone1"
                  name="phone1"
                  placeholder="Enter phone number"
                />
                <input
                  type="tel"
                  class="form-control"
                  id="phone2"
                  name="phone2"
                  placeholder="Enter phone number"
                />
                <input
                  type="tel"
                  class="form-control"
                  id="phone3"
                  name="phone3"
                  placeholder="Enter phone number"
                />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Product name</label>
              <div class="d-flex flex-wrap gap-2">
                <div
                  class="d-flex flex-row gap-2 w-100 justify-content-between"
                >
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="option1"
                      name="option1"
                      data-value="Product name 1"
                    />
                    <label class="form-check-label" for="option1">
                      <img
                        src="https://via.placeholder.com/50"
                        alt="Option 1"
                        class="img-fluid me-2"
                      />
                    </label>
                  </div>
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="option2"
                      name="option2"
                      value="Product 2"
                    />
                    <label class="form-check-label" for="option2">
                      <img
                        src="https://via.placeholder.com/50"
                        alt="Option 2"
                        class="img-fluid me-2"
                      />
                    </label>
                  </div>
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="option3"
                      name="option3"
                      data-value="Product 3"
                    />
                    <label class="form-check-label" for="option3">
                      <img
                        src="https://via.placeholder.com/50"
                        alt="Option 3"
                        class="img-fluid me-2"
                      />
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="checkbox_policy"
                name="checkbox1"
              />
              <label class="form-check-label" for="checkbox1">
                I agree to the terms and conditions
              </label>
            </div>
            <button type="submit" id="btnSubmitForm1" class="btn btn-primary">
              Submit Form 1
            </button>
          </form>
        </div>
        <div class="col-md-4">
          <form id="form1" class="mb-4">
            <h3>Form 2</h3>
            <div class="mb-3">
              <label for="email2" class="form-label">Email</label>
              <div class="d-flex gap-2">
                <input
                  type="email"
                  class="form-control"
                  id="email2"
                  name="email2"
                  placeholder="Enter email"
                />
              </div>
            </div>
            <div class="mb-3">
              <label for="phone1" class="form-label">Phone Number</label>
              <div class="d-flex gap-2">
                <input
                  type="tel"
                  class="form-control"
                  id="phone4"
                  name="phone4"
                  placeholder="Enter phone number"
                />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Product name</label>
              <div class="d-flex flex-wrap gap-2">
                <div
                  class="d-flex flex-row gap-2 w-100 justify-content-between"
                >
                  <div class="form-check">
                    <input
                      type="radio"
                      class="form-check-input"
                      id="option4"
                      name="productOptions"
                      data-value="Product 4"
                    />
                    <label class="form-check-label" for="option4">
                      <img
                        src="https://via.placeholder.com/50"
                        alt="Option 4"
                        class="img-fluid me-2"
                      />
                    </label>
                  </div>
                  <div class="form-check">
                    <input
                      type="radio"
                      class="form-check-input"
                      id="option5"
                      name="productOptions"
                      data-value="Product 5"
                    />
                    <label class="form-check-label" for="option5">
                      <img
                        src="https://via.placeholder.com/50"
                        alt="Option 5"
                        class="img-fluid me-2"
                      />
                    </label>
                  </div>
                  <div class="form-check">
                    <input
                      type="radio"
                      class="form-check-input"
                      id="option6"
                      name="productOptions"
                      data-value="Product 6"
                    />
                    <label class="form-check-label" for="option6">
                      <img
                        src="https://via.placeholder.com/50"
                        alt="Option 6"
                        class="img-fluid me-2"
                      />
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="checkbox_policy"
                name="checkbox1"
              />
              <label class="form-check-label" for="checkbox1">
                I agree to the terms and conditions
              </label>
            </div>
            <button type="submit" id="btnSubmitForm2" class="btn btn-primary">
              Submit Form 2
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.min.js"></script>
    <script src="/script.js"></script>
    <!-- <script src="https://cdn-data.hop-dev.com/mui_com__contact.js" defer></script> -->
  </body>
</html>
